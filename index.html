<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration & Result Portal</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Student Registration & Result Portal
            </span>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="card shadow p-4">

            <h2 class="text-center text-primary mb-4">
                Student Registration
            </h2>

            <form id="studentForm">

                <!-- Student Name -->
                <div class="mb-3">
                    <label class="form-label">Student Name</label>
                    <input
                        type="text"
                        id="studentName"
                        class="form-control"
                        placeholder="Enter student name"
                        required>
                </div>

                <!-- Register Number -->
                <div class="mb-3">
                    <label class="form-label">Register Number</label>
                    <input
                        type="text"
                        id="registerNumber"
                        class="form-control"
                        placeholder="Enter register number"
                        required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter email"
                        required>
                </div>

                <!-- Course -->
                <div class="mb-3">
                    <label class="form-label">Select Course</label>

                    <select id="course" class="form-select" required>
                        <option value="">-- Select Course --</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="CSBS">CSBS</option>
                        <option value="Information Technology">
                            Information Technology
                        </option>
                        <option value="ECE">
                            Electronics and Communication Engineering
                        </option>
                    </select>
                </div>

                <h4 class="mt-4 mb-3">Enter Subject Marks</h4>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">HTML</label>
                        <input
                            type="number"
                            id="html"
                            class="form-control"
                            min="0"
                            max="100"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">CSS</label>
                        <input
                            type="number"
                            id="css"
                            class="form-control"
                            min="0"
                            max="100"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">JavaScript</label>
                        <input
                            type="number"
                            id="javascript"
                            class="form-control"
                            min="0"
                            max="100"
                            required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Bootstrap</label>
                        <input
                            type="number"
                            id="bootstrap"
                            class="form-control"
                            min="0"
                            max="100"
                            required>
                    </div>

                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">
                    Calculate Result
                </button>

            </form>

        </div>

        <!-- Result -->
        <div id="result" class="card shadow p-4 mt-4 d-none">

            <h2 class="text-center text-success">
                Student Result
            </h2>

            <table class="table table-bordered mt-3">

                <tr>
                    <th>Student Name</th>
                    <td id="displayName"></td>
                </tr>

                <tr>
                    <th>Register Number</th>
                    <td id="displayRegister"></td>
                </tr>

                <tr>
                    <th>Email</th>
                    <td id="displayEmail"></td>
                </tr>

                <tr>
                    <th>Course</th>
                    <td id="displayCourse"></td>
                </tr>

                <tr>
                    <th>Total Marks</th>
                    <td id="displayTotal"></td>
                </tr>

                <tr>
                    <th>Percentage</th>
                    <td id="displayPercentage"></td>
                </tr>

                <tr>
                    <th>Status</th>
                    <td id="displayStatus"></td>
                </tr>

            </table>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
